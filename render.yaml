services:
  # 1. Backend Microservices (FastAPI)
  - type: web
    name: tecnoventas-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0

  # 2. Frontend Portal (Vite React + Tailwind CSS)
  - type: web
    name: tecnoventas-frontend
    env: static
    buildCommand: npm run build
    staticPublishPath: dist
    rootDir: frontend
    routes:
      # Rewrite rule to route all paths to index.html for React Router (Single Page Application) support
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Dynamically bind the frontend API URL to the backend service host
      - key: VITE_API_URL
        fromService:
          type: web
          name: tecnoventas-backend
          property: host
